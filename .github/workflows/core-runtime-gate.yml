name: Core Runtime Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: scripts/run_core_runtime_gate.sh
