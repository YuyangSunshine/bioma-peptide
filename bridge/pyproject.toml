[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bioma-peptide-bridge"
version = "0.1.0"
description = "Peptide contracts and local persistent scientific jobs; no BioMA runtime dependency"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bioma-peptide = "bioma_peptide_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
